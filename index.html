<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Dashboard</p>
        <h1>Membership Overview</h1>
      </div>
    </header>

    <main>
      <section class="kpi-grid">
        <article class="kpi-card active-card">
          <p>Total Annual Memberships</p>
          <h2 id="active-count">0</h2>
        </article>
        <article class="kpi-card lifetime-card">
          <p>Total Lifetime Memberships</p>
          <h2 id="lifetime-count">0</h2>
        </article>
      </section>

      <section class="chart-grid">
        <article class="panel">
          <div class="panel-heading">
            <h3>Annual vs Lifetime</h3>
          </div>
          <div class="chart-wrap">
            <canvas id="pieChart"></canvas>
          </div>
        </article>

        <article class="panel">
          <div class="panel-heading">
            <h3>Membership Mix</h3>
          </div>
          <div class="chart-wrap">
            <canvas id="barChart"></canvas>
          </div>
        </article>
      </section>

      <section class="panel trend-panel">
        <div class="panel-heading">
          <h3>Subscriptions by Year</h3>
        </div>
        <div class="chart-wrap chart-wrap-wide">
          <canvas id="yearChart"></canvas>
        </div>
      </section>

      <section class="panel table-panel">
        <div class="panel-heading">
          <h3>Membership Records</h3>
        </div>
        <div id="table-container" class="table-container"></div>
      </section>

      <section id="error-banner" class="error-banner hidden" aria-live="polite"></section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
